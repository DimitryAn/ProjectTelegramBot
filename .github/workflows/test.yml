name: tests
on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read
 

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: go-tests
        run: go test ./...